[package]
name = "nsticky"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
regex = "1"
dirs = "5"
once_cell = "1"

[profile.release]
strip = true
lto = true
